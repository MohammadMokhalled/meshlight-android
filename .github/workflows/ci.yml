name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reused by release.yml so a tagged release runs exactly the same checks.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    name: CI script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run CI script tests
        run: python3 -m unittest discover -s scripts/tests -v

  host:
    name: Builds, JVM tests, screenshots and lint
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
      - name: Install pinned Android SDK packages
        shell: pwsh
        run: |
          sdkmanager.bat 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
          exit $LASTEXITCODE
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Run every host check and build APKs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          .\gradlew.bat :app:testDebugUnitTest :app:jacocoDebugReport :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:lintDebug :app:validateDebugScreenshotTest --no-configuration-cache --continue --console=plain 2>&1 | Tee-Object -FilePath build\android-host.log
          exit $LASTEXITCODE
      - name: Validate reports and stage APKs
        shell: bash
        run: python scripts/ci.py stage-host --output build/android-apks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apks
          path: build/android-apks/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Upload host reports and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-host-results
          path: |
            build/android-host.log
            app/build/reports/
            app/build/test-results/
            app/build/outputs/screenshotTest-results/
          overwrite: true
          retention-days: 30

  device:
    name: API 37 instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
      - name: Keep pinned command-line tools selected by the emulator action
        # The emulator action prepends cmdline-tools/latest to PATH. The runner's
        # preinstalled tools cannot parse Android 37.0 AVD targets correctly.
        run: |
          pinned_tools="$ANDROID_HOME/cmdline-tools/15859902"
          test -x "$pinned_tools/bin/avdmanager"
          if [[ -e "$ANDROID_HOME/cmdline-tools/latest" ]]; then
            mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/runner-preinstalled"
          fi
          ln -s "$pinned_tools" "$ANDROID_HOME/cmdline-tools/latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build instrumentation APKs before starting the emulator
        run: |
          mkdir -p build
          bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest \
            --no-configuration-cache --max-workers=2 --console=plain \
            2>&1 | tee build/android-device-build.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          avd-name: meshlight-api37
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -camera-back none
          pre-emulator-launch-script: python3 scripts/ci.py verify-avd --name meshlight-api37 --output build/android-avd.json
          script: python3 scripts/ci.py run-device --output build
      - name: Validate instrumentation reports
        run: python3 scripts/ci.py stage-device --output build/android-device.json
      - name: Upload emulator reports and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-device-results
          path: |
            build/android-device.log
            build/android-device-build.log
            build/android-logcat.log
            build/android-avd.json
            build/android-device.json
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          overwrite: true
          retention-days: 30

  complete:
    name: All checks
    if: ${{ always() }}
    needs: [scripts, host, device]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          python3 -c 'import json,os,sys; r=json.loads(os.environ["RESULTS"]); bad={k:v["result"] for k,v in r.items() if v["result"]!="success"}; sys.exit(f"Not successful: {bad}") if bad or not r else None'
