name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub Release
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: android-apks
          path: build/release
      - name: Check the tag matches the app version and write checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/ci.py check-tag --tag "$TAG" --directory build/release
          python3 scripts/ci.py checksums --directory build/release
          cat build/release/SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Create as a draft, upload everything, then publish, so a partial
          # upload is never visible as a release.
          gh release create "$TAG" --draft --verify-tag --title "MeshLight Android $TAG" --generate-notes
          gh release upload "$TAG" \
            build/release/meshlight-android-debug.apk \
            build/release/meshlight-android-release-unsigned.apk \
            build/release/SHA256SUMS
          gh release edit "$TAG" --draft=false
